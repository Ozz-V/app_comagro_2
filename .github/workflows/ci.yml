name: CI Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-checks:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d # v1.5.2
        with:
          deno-version: v2.x

      - name: Deno Lint & Type Check (Edge Functions)
        run: |
          cd supabase/functions
          deno lint --config deno.json
          deno check --config deno.json **/*.ts

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check (UI & Logic)
        run: npx tsc --noEmit

      - name: Run ESLint (Strict)
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
        run: npx eslint . --ext .js,.jsx,.ts,.tsx

      - name: Run Tests with Coverage
        run: npx jest --coverage --passWithNoTests
